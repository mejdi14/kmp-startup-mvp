<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Which backend does a build talk to?">
<title>Which backend does a build talk to?</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1840"/><stop offset="1" stop-color="#2C2063"/></linearGradient>
<clipPath id="card"><rect width="960" height="340" rx="24"/></clipPath>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>

</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'}
.t{fill:#fff;font-weight:700}
.m{fill:#B9B4D8}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="960" height="340" fill="url(#bg)"/>
<circle cx="870" cy="20" r="140" fill="#7F52FF" opacity=".45" filter="url(#blur)"/>
<circle cx="60" cy="340" r="120" fill="#FF6B9D" opacity=".22" filter="url(#blur)"/>
<circle cx="480.0" cy="380" r="110" fill="#3ECF8E" opacity=".12" filter="url(#blur)"/>
<path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:0s" transform="translate(890 48) scale(1.1)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FFC93C" opacity=".7" class="tw" style="animation-delay:1.1s" transform="translate(840 82) scale(0.7)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:2.0s" transform="translate(926 104) scale(0.6)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FF6B9D" opacity=".7" class="tw" style="animation-delay:0.6s" transform="translate(528.0 36) scale(0.6)"/>
<text x="40" y="54" font-size="13" font-weight="800" letter-spacing="2.5" fill="#FFC93C">ENVIRONMENTS</text>
<text x="40" y="89" font-size="28" class="t">Which backend does a build talk to?</text>
<g filter="url(#shadow)"><rect x="40" y="118" width="290" height="72" rx="18" fill="#26225C" stroke="#3ECF8E" stroke-opacity=".6" stroke-width="1.5"/></g>
<circle cx="78" cy="154" r="22" fill="#3ECF8E" fill-opacity=".18"/>
<text x="78" y="155" font-size="22" text-anchor="middle" dominant-baseline="central">🧪</text>
<text x="112" y="150" font-size="16.5" class="t" text-anchor="start">Debug builds</text>
<text x="112" y="171" font-size="12.5" class="m" text-anchor="start">Android debug · Xcode Debug</text>
<g filter="url(#shadow)"><rect x="630" y="118" width="290" height="72" rx="18" fill="#26225C" stroke="#3ECF8E" stroke-opacity=".6" stroke-width="1.5"/></g>
<circle cx="668" cy="154" r="22" fill="#3ECF8E" fill-opacity=".18"/>
<text x="668" y="155" font-size="22" text-anchor="middle" dominant-baseline="central">🐳</text>
<text x="702" y="150" font-size="16.5" class="t" text-anchor="start">Local Supabase</text>
<text x="702" y="171" font-size="12.5" class="m" text-anchor="start">localhost:54321 · Docker</text>
<line x1="342" y1="154" x2="610" y2="154" stroke="#3ECF8E" stroke-width="3" stroke-linecap="round" class="flow"/>
<path d="M608,147 L620,154 L608,161Z" fill="#3ECF8E"/>
<g transform="translate(393 140)"><rect x="0" y="0" width="175" height="28" rx="14.0" fill="#1A1840" stroke="#3ECF8E" stroke-width="1.5"/><text x="87" y="14.0" font-size="12" class="mono" fill="#3ECF8E" font-weight="700" text-anchor="middle" dominant-baseline="central">SUPABASE_ENV = LOCAL</text></g>
<g filter="url(#shadow)"><rect x="40" y="206" width="290" height="72" rx="18" fill="#26225C" stroke="#A78BFA" stroke-opacity=".6" stroke-width="1.5"/></g>
<circle cx="78" cy="242" r="22" fill="#A78BFA" fill-opacity=".18"/>
<text x="78" y="243" font-size="22" text-anchor="middle" dominant-baseline="central">🚀</text>
<text x="112" y="238" font-size="16.5" class="t" text-anchor="start">Release builds</text>
<text x="112" y="259" font-size="12.5" class="m" text-anchor="start">Android release · Xcode Release</text>
<g filter="url(#shadow)"><rect x="630" y="206" width="290" height="72" rx="18" fill="#26225C" stroke="#A78BFA" stroke-opacity=".6" stroke-width="1.5"/></g>
<circle cx="668" cy="242" r="22" fill="#A78BFA" fill-opacity=".18"/>
<text x="668" y="243" font-size="22" text-anchor="middle" dominant-baseline="central">☁️</text>
<text x="702" y="238" font-size="16.5" class="t" text-anchor="start">Hosted Supabase</text>
<text x="702" y="259" font-size="12.5" class="m" text-anchor="start">your project on supabase.co</text>
<line x1="342" y1="242" x2="610" y2="242" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" class="flow"/>
<path d="M608,235 L620,242 L608,249Z" fill="#A78BFA"/>
<g transform="translate(389 228)"><rect x="0" y="0" width="182" height="28" rx="14.0" fill="#1A1840" stroke="#A78BFA" stroke-width="1.5"/><text x="91" y="14.0" font-size="12" class="mono" fill="#A78BFA" font-weight="700" text-anchor="middle" dominant-baseline="central">SUPABASE_ENV = HOSTED</text></g>
<text x="40" y="312" font-size="13.5" class="m" text-anchor="start">🔓  Only the URL + public anon key ship in the app. Real secrets stay server-side in supabase/.env.</text>
</g>
</svg>
