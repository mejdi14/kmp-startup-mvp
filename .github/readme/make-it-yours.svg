<g transform="translate(326 114)"><rect x="0" y="0" width="52" height="20" rx="10.0" fill="#1A1840" stroke="#8E6CFF" stroke-width="1.5"/><text x="26" y="10.0" font-size="11" class="" fill="#8E6CFF" font-weight="700" text-anchor="middle" dominant-baseline="central">LV 3</text></g>
<text x="351.6" y="262" font-size="15" class="t" text-anchor="middle">Sign-in</text>
<text x="351.6" y="281" font-size="12" class="m" text-anchor="middle">OAuth · guests</text>
<g filter="url(#shadow)"><polygon points="479.9,148.0 516.3,169.0 516.3,211.0 479.9,232.0 443.5,211.0 443.5,169.0" fill="#635BFF" stroke="#1A1840" stroke-width="5" stroke-linejoin="round"/></g>
<text x="479.90000000000003" y="191" font-size="30" text-anchor="middle" dominant-baseline="central">💳</text>
