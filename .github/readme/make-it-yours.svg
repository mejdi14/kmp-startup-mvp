<g transform="translate(711 114)"><rect x="0" y="0" width="52" height="20" rx="10.0" fill="#1A1840" stroke="#FF6B9D" stroke-width="1.5"/><text x="26" y="10.0" font-size="11" class="" fill="#FF6B9D" font-weight="700" text-anchor="middle" dominant-baseline="central">LV 6</text></g>
