<text x="864.8000000000001" y="191" font-size="32" text-anchor="middle" dominant-baseline="central" class="bob">🏆</text>
<text x="864.8000000000001" y="262" font-size="15" class="t" text-anchor="middle" fill="#FFC93C">Ship it!</text>
<text x="864.8000000000001" y="281" font-size="12" class="m" text-anchor="middle">v1.0 🎉</text>
