<g transform="translate(198 114)"><rect x="0" y="0" width="52" height="20" rx="10.0" fill="#1A1840" stroke="#2BB57B" stroke-width="1.5"/><text x="26" y="10.0" font-size="11" class="" fill="#2BB57B" font-weight="700" text-anchor="middle" dominant-baseline="central">LV 2</text></g>
<text x="223.3" y="262" font-size="15" class="t" text-anchor="middle">Backend</text>
<text x="223.3" y="281" font-size="12" class="m" text-anchor="middle">Supabase project</text>
<g filter="url(#shadow)"><polygon points="351.6,148.0 388.0,169.0 388.0,211.0 351.6,232.0 315.2,211.0 315.2,169.0" fill="#8E6CFF" stroke="#1A1840" stroke-width="5" stroke-linejoin="round"/></g>
