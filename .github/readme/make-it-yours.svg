<text x="479.90000000000003" y="262" font-size="15" class="t" text-anchor="middle">Payments</text>
<text x="479.90000000000003" y="281" font-size="12" class="m" text-anchor="middle">Stripe · webhook</text>
<g filter="url(#shadow)"><polygon points="608.2,148.0 644.6,169.0 644.6,211.0 608.2,232.0 571.8,211.0 571.8,169.0" fill="#F05A1A" stroke="#1A1840" stroke-width="5" stroke-linejoin="round"/></g>
