<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Make it yours in six levels">
<title>Make it yours in six levels</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1840"/><stop offset="1" stop-color="#2C2063"/></linearGradient>
<clipPath id="card"><rect width="960" height="320" rx="24"/></clipPath>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
<linearGradient id="xp" gradientUnits="userSpaceOnUse" x1="95" y1="0" x2="865" y2="0"><stop offset="0" stop-color="#7F52FF"/><stop offset=".55" stop-color="#FF6B9D"/><stop offset="1" stop-color="#FFC93C"/></linearGradient><radialGradient id="gold" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFE58A"/><stop offset="1" stop-color="#FFB300"/></radialGradient>
</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'}
.t{fill:#fff;font-weight:700}
.m{fill:#B9B4D8}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="960" height="320" fill="url(#bg)"/>
<circle cx="870" cy="20" r="140" fill="#7F52FF" opacity=".45" filter="url(#blur)"/>
<circle cx="60" cy="320" r="120" fill="#FF6B9D" opacity=".22" filter="url(#blur)"/>
<circle cx="480.0" cy="360" r="110" fill="#3ECF8E" opacity=".12" filter="url(#blur)"/>
<path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:0s" transform="translate(890 48) scale(1.1)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FFC93C" opacity=".7" class="tw" style="animation-delay:1.1s" transform="translate(840 82) scale(0.7)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:2.0s" transform="translate(926 104) scale(0.6)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FF6B9D" opacity=".7" class="tw" style="animation-delay:0.6s" transform="translate(528.0 36) scale(0.6)"/>
<text x="40" y="54" font-size="13" font-weight="800" letter-spacing="2.5" fill="#FFC93C">LEVEL UP</text>
<text x="40" y="89" font-size="28" class="t">Make it yours in six levels</text>
<line x1="95.0" y1="190" x2="864.8000000000001" y2="190" stroke="#2E2A66" stroke-width="16" stroke-linecap="round"/>
<line x1="95.0" y1="190" x2="864.8000000000001" y2="190" stroke="url(#xp)" stroke-width="10" stroke-linecap="round"/>
<line x1="95.0" y1="190" x2="864.8000000000001" y2="190" stroke="#fff" stroke-width="2" opacity=".45" class="flow"/>
<g filter="url(#shadow)"><polygon points="95.0,148.0 131.4,169.0 131.4,211.0 95.0,232.0 58.6,211.0 58.6,169.0" fill="#0A84FF" stroke="#1A1840" stroke-width="5" stroke-linejoin="round"/></g>
<text x="95.0" y="191" font-size="30" text-anchor="middle" dominant-baseline="central">🏷️</text>
<g transform="translate(69 114)"><rect x="0" y="0" width="52" height="20" rx="10.0" fill="#1A1840" stroke="#0A84FF" stroke-width="1.5"/><text x="26" y="10.0" font-size="11" class="" fill="#0A84FF" font-weight="700" text-anchor="middle" dominant-baseline="central">LV 1</text></g>
