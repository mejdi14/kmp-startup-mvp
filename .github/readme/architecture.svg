<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'}
.t{fill:#fff;font-weight:700}
.m{fill:#B9B4D8}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
