<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="Every push rides two lines">
<title>Every push rides two lines</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1840"/><stop offset="1" stop-color="#2C2063"/></linearGradient>
<clipPath id="card"><rect width="960" height="390" rx="24"/></clipPath>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>

</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'}
.t{fill:#fff;font-weight:700}
.m{fill:#B9B4D8}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="960" height="390" fill="url(#bg)"/>
<circle cx="870" cy="20" r="140" fill="#7F52FF" opacity=".45" filter="url(#blur)"/>
<circle cx="60" cy="390" r="120" fill="#FF6B9D" opacity=".22" filter="url(#blur)"/>
<circle cx="480.0" cy="430" r="110" fill="#3ECF8E" opacity=".12" filter="url(#blur)"/>
<path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:0s" transform="translate(890 48) scale(1.1)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FFC93C" opacity=".7" class="tw" style="animation-delay:1.1s" transform="translate(840 82) scale(0.7)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:2.0s" transform="translate(926 104) scale(0.6)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FF6B9D" opacity=".7" class="tw" style="animation-delay:0.6s" transform="translate(528.0 36) scale(0.6)"/>
<text x="40" y="54" font-size="13" font-weight="800" letter-spacing="2.5" fill="#FFC93C">CONTINUOUS INTEGRATION</text>
<text x="40" y="89" font-size="28" class="t">Every push rides two lines</text>
<g transform="translate(0 32)"><path d="M80,205 H130 C175,205 175,145 220,145 H740 C785,145 785,205 830,205 H880" fill="none" stroke="#3DDC84" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80,205 H130 C175,205 175,145 220,145 H740 C785,145 785,205 830,205 H880" fill="none" stroke="#fff" stroke-width="2" opacity=".5" class="flow"/>
<rect x="-10" y="-5" width="20" height="10" rx="5" fill="#fff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" rotate="auto" path="M80,205 H130 C175,205 175,145 220,145 H740 C785,145 785,205 830,205 H880"/></rect>
<path d="M80,205 H130 C175,205 175,265 220,265 H740 C785,265 785,205 830,205 H880" fill="none" stroke="#5AC8FA" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80,205 H130 C175,205 175,265 220,265 H740 C785,265 785,205 830,205 H880" fill="none" stroke="#fff" stroke-width="2" opacity=".5" class="flow"/>
<rect x="-10" y="-5" width="20" height="10" rx="5" fill="#fff" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M80,205 H130 C175,205 175,265 220,265 H740 C785,265 785,205 830,205 H880"/></rect>
<circle cx="270" cy="145" r="11" fill="#fff" stroke="#3DDC84" stroke-width="5"/>
<text x="270" y="106" font-size="13.5" class="t" text-anchor="middle">Shared tests</text>
<text x="270" y="123" font-size="11.5" class="mono" text-anchor="middle" fill="#B9B4D8">allTests</text>
<circle cx="420" cy="145" r="11" fill="#fff" stroke="#3DDC84" stroke-width="5"/>
<text x="420" y="106" font-size="13.5" class="t" text-anchor="middle">Unit tests</text>
<text x="420" y="123" font-size="11.5" class="mono" text-anchor="middle" fill="#B9B4D8">testDebugUnitTest</text>
<circle cx="570" cy="145" r="11" fill="#fff" stroke="#3DDC84" stroke-width="5"/>
<text x="570" y="106" font-size="13.5" class="t" text-anchor="middle">Lint</text>
<text x="570" y="123" font-size="11.5" class="mono" text-anchor="middle" fill="#B9B4D8">lintDebug</text>
<circle cx="710" cy="145" r="11" fill="#fff" stroke="#3DDC84" stroke-width="5"/>
<text x="710" y="106" font-size="13.5" class="t" text-anchor="middle">Assemble</text>
<text x="710" y="123" font-size="11.5" class="mono" text-anchor="middle" fill="#B9B4D8">debug + release</text>
<circle cx="340" cy="265" r="11" fill="#fff" stroke="#5AC8FA" stroke-width="5"/>
<text x="340" y="300" font-size="13.5" class="t" text-anchor="middle">Kotlin/Native tests</text>
<text x="340" y="317" font-size="11.5" class="mono" text-anchor="middle" fill="#B9B4D8">iosSimulatorArm64Test</text>
<circle cx="620" cy="265" r="11" fill="#fff" stroke="#5AC8FA" stroke-width="5"/>
<text x="620" y="300" font-size="13.5" class="t" text-anchor="middle">Xcode build</text>
<text x="620" y="317" font-size="11.5" class="mono" text-anchor="middle" fill="#B9B4D8">simulator · unsigned</text>
<g transform="translate(250 168)"><rect x="0" y="0" width="235" height="26" rx="13.0" fill="#1A1840" stroke="#3DDC84" stroke-width="1.5"/><text x="117" y="13.0" font-size="12" class="" fill="#3DDC84" font-weight="700" text-anchor="middle" dominant-baseline="central">🤖 Android line · ubuntu-latest</text></g>
<g transform="translate(250 216)"><rect x="0" y="0" width="172" height="26" rx="13.0" fill="#1A1840" stroke="#5AC8FA" stroke-width="1.5"/><text x="86" y="13.0" font-size="12" class="" fill="#5AC8FA" font-weight="700" text-anchor="middle" dominant-baseline="central">🍎 iOS line · macos-15</text></g>
<g filter="url(#shadow)"><circle cx="80" cy="205" r="32" fill="#FFC93C" stroke="#1A1840" stroke-width="5"/></g>
<text x="80" y="206" font-size="28" text-anchor="middle" dominant-baseline="central" class="bob">🚀</text>
<text x="80" y="262" font-size="14" class="t" text-anchor="middle">push / PR</text>
<circle cx="880" cy="205" r="46" fill="#3ECF8E" opacity=".25" filter="url(#glow)" class="pulse"/>
<g filter="url(#shadow)"><circle cx="880" cy="205" r="32" fill="#2BB57B" stroke="#1A1840" stroke-width="5"/></g>
<text x="880" y="206" font-size="28" text-anchor="middle" dominant-baseline="central">✅</text>
<text x="880" y="262" font-size="14" class="t" text-anchor="middle">green build</text></g>
</g>
</svg>
