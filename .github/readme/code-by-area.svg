<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Where the 7.3k lines of code live">
<title>Where the 7.3k lines of code live</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1840"/><stop offset="1" stop-color="#2C2063"/></linearGradient>
<clipPath id="card"><rect width="960" height="320" rx="24"/></clipPath>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>

</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'}
.t{fill:#fff;font-weight:700}
.m{fill:#B9B4D8}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="960" height="320" fill="url(#bg)"/>
<circle cx="870" cy="20" r="140" fill="#7F52FF" opacity=".45" filter="url(#blur)"/>
<circle cx="60" cy="320" r="120" fill="#FF6B9D" opacity=".22" filter="url(#blur)"/>
<circle cx="480.0" cy="360" r="110" fill="#3ECF8E" opacity=".12" filter="url(#blur)"/>
<path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:0s" transform="translate(890 48) scale(1.1)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FFC93C" opacity=".7" class="tw" style="animation-delay:1.1s" transform="translate(840 82) scale(0.7)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:2.0s" transform="translate(926 104) scale(0.6)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FF6B9D" opacity=".7" class="tw" style="animation-delay:0.6s" transform="translate(528.0 36) scale(0.6)"/>
<text x="40" y="54" font-size="13" font-weight="800" letter-spacing="2.5" fill="#FFC93C">BY THE NUMBERS</text>
<text x="40" y="89" font-size="28" class="t">Where the 7.3k lines of code live</text>
<rect x="40.0" y="150" width="165.4" height="48" rx="6" fill="#3987e5"><title>Shared logic: 1,382 lines (19%)</title></rect>
<text x="42" y="138" font-size="17" class="t" text-anchor="start">19%</text>
<rect x="42.0" y="216" width="12" height="12" rx="3" fill="#3987e5"/>
<text x="61" y="227" font-size="13.5" class="t" text-anchor="start">🧠 Shared logic</text>
<text x="61" y="247" font-size="12.5" class="m" text-anchor="start">1,382 lines</text>
<rect x="207.4" y="150" width="205.9" height="48" rx="6" fill="#d95926"><title>Android UI: 1,720 lines (24%)</title></rect>
<text x="209.39994510019216" y="138" font-size="17" class="t" text-anchor="start">24%</text>
<rect x="209.4" y="216" width="12" height="12" rx="3" fill="#d95926"/>
<text x="228.39994510019216" y="227" font-size="13.5" class="t" text-anchor="start">🤖 Android UI</text>
<text x="228.39994510019216" y="247" font-size="12.5" class="m" text-anchor="start">1,720 lines</text>
<rect x="415.3" y="150" width="167.9" height="48" rx="6" fill="#199e70"><title>iOS UI: 1,403 lines (19%)</title></rect>
<text x="417.2522646170738" y="138" font-size="17" class="t" text-anchor="start">19%</text>
<rect x="417.3" y="216" width="12" height="12" rx="3" fill="#199e70"/>
<text x="436.2522646170738" y="227" font-size="13.5" class="t" text-anchor="start">🍎 iOS UI</text>
<text x="436.2522646170738" y="247" font-size="12.5" class="m" text-anchor="start">1,403 lines</text>
<rect x="585.2" y="150" width="145.1" height="48" rx="6" fill="#c98500"><title>Tests &amp; checks: 1,212 lines (17%)</title></rect>
<text x="587.1655229206698" y="138" font-size="17" class="t" text-anchor="start">17%</text>
<rect x="587.2" y="216" width="12" height="12" rx="3" fill="#c98500"/>
<text x="606.1655229206698" y="227" font-size="13.5" class="t" text-anchor="start">🧪 Tests &amp; checks</text>
<text x="606.1655229206698" y="247" font-size="12.5" class="m" text-anchor="start">1,212 lines</text>
<rect x="732.2" y="150" width="187.8" height="48" rx="6" fill="#d55181"><title>Supabase: 1,569 lines (22%)</title></rect>
<text x="734.2195992314028" y="138" font-size="17" class="t" text-anchor="start">22%</text>
<rect x="734.2" y="216" width="12" height="12" rx="3" fill="#d55181"/>
<text x="753.2195992314028" y="227" font-size="13.5" class="t" text-anchor="start">⚡ Supabase</text>
<text x="753.2195992314028" y="247" font-size="12.5" class="m" text-anchor="start">1,569 lines</text>
<text x="40" y="292" font-size="13.5" class="m" text-anchor="start">💜  The shared core is under a fifth of the 7,286 lines — and both apps run on it.</text>
</g>
</svg>
