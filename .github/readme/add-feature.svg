<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Adding a feature in five steps">
<title>Adding a feature in five steps</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1840"/><stop offset="1" stop-color="#2C2063"/></linearGradient>
<clipPath id="card"><rect width="960" height="400" rx="24"/></clipPath>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>

</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'}
.t{fill:#fff;font-weight:700}
.m{fill:#B9B4D8}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="960" height="400" fill="url(#bg)"/>
<circle cx="870" cy="20" r="140" fill="#7F52FF" opacity=".45" filter="url(#blur)"/>
<circle cx="60" cy="400" r="120" fill="#FF6B9D" opacity=".22" filter="url(#blur)"/>
<circle cx="480.0" cy="440" r="110" fill="#3ECF8E" opacity=".12" filter="url(#blur)"/>
<path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:0s" transform="translate(890 48) scale(1.1)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FFC93C" opacity=".7" class="tw" style="animation-delay:1.1s" transform="translate(840 82) scale(0.7)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity=".7" class="tw" style="animation-delay:2.0s" transform="translate(926 104) scale(0.6)"/><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#FF6B9D" opacity=".7" class="tw" style="animation-delay:0.6s" transform="translate(528.0 36) scale(0.6)"/>
<text x="40" y="54" font-size="13" font-weight="800" letter-spacing="2.5" fill="#FFC93C">RECIPE</text>
<text x="40" y="89" font-size="28" class="t">Adding a feature in five steps</text>
<g transform="translate(40 112)"><rect x="0" y="0" width="258" height="28" rx="14.0" fill="#1A1840" stroke="#C4B5FD" stroke-width="1.5"/><text x="129" y="14.0" font-size="12.5" class="" fill="#C4B5FD" font-weight="700" text-anchor="middle" dominant-baseline="central">🧠 steps 1–4: shared, tested once</text></g>
<g transform="translate(730 112)"><rect x="0" y="0" width="222" height="28" rx="14.0" fill="#1A1840" stroke="#FFC93C" stroke-width="1.5"/><text x="111" y="14.0" font-size="12.5" class="" fill="#FFC93C" font-weight="700" text-anchor="middle" dominant-baseline="central">📱 step 5: once per platform</text></g>
<g filter="url(#shadow)"><rect x="40" y="265" width="155" height="110" rx="16" fill="#5B3BB8"/></g>
<circle cx="66" cy="291" r="15" fill="#FFC93C"/>
<text x="66" y="291" font-size="14" font-weight="800" fill="#1A1840" text-anchor="middle" dominant-baseline="central">1</text>
<text x="102" y="292" font-size="22" text-anchor="middle" dominant-baseline="central">🔌</text>
<text x="56" y="329" font-size="16" class="t" text-anchor="start">Repository</text>
<text x="56" y="349" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">interface +</text>
<text x="56" y="365" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">Supabase impl</text>
<g filter="url(#shadow)"><rect x="205" y="230" width="155" height="145" rx="16" fill="#6A45D0"/></g>
<circle cx="231" cy="256" r="15" fill="#FFC93C"/>
<text x="231" y="256" font-size="14" font-weight="800" fill="#1A1840" text-anchor="middle" dominant-baseline="central">2</text>
<text x="267" y="257" font-size="22" text-anchor="middle" dominant-baseline="central">🗃️</text>
<text x="221" y="294" font-size="16" class="t" text-anchor="start">Store</text>
<text x="221" y="314" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">StateFlow +</text>
<text x="221" y="330" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">@Throws suspend</text>
<g filter="url(#shadow)"><rect x="370" y="195" width="155" height="180" rx="16" fill="#7F52FF"/></g>
<circle cx="396" cy="221" r="15" fill="#FFC93C"/>
<text x="396" y="221" font-size="14" font-weight="800" fill="#1A1840" text-anchor="middle" dominant-baseline="central">3</text>
<text x="432" y="222" font-size="22" text-anchor="middle" dominant-baseline="central">🧪</text>
<text x="386" y="259" font-size="16" class="t" text-anchor="start">Tests</text>
<text x="386" y="279" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">fake repo in</text>
<text x="386" y="295" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">commonTest</text>
<g filter="url(#shadow)"><rect x="535" y="160" width="155" height="215" rx="16" fill="#9472FF"/></g>
<circle cx="561" cy="186" r="15" fill="#FFC93C"/>
<text x="561" y="186" font-size="14" font-weight="800" fill="#1A1840" text-anchor="middle" dominant-baseline="central">4</text>
<text x="597" y="187" font-size="22" text-anchor="middle" dominant-baseline="central">🔗</text>
<text x="551" y="224" font-size="16" class="t" text-anchor="start">Wire it</text>
<text x="551" y="244" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">KmpApplication</text>
<text x="551" y="260" font-size="12" class="t" text-anchor="start" fill="#EDE7FF" font-weight="500">+ AppGraph</text>
<text x="668" y="136" font-size="34" text-anchor="middle" dominant-baseline="central" class="bob">🧗</text>
<path d="M690,185 C712,185 708,200 728,200" stroke="#3DDC84" stroke-width="3" fill="none" class="flow"/>
<path d="M690,300 C712,300 708,320 728,320" stroke="#5AC8FA" stroke-width="3" fill="none" class="flow"/>
<g filter="url(#shadow)"><rect x="730" y="152" width="190" height="96" rx="16" fill="#26225C" stroke="#3DDC84" stroke-width="2"/></g>
<rect x="746" y="166" width="32" height="22" rx="11" fill="#3DDC84"/>
<text x="762" y="177" font-size="12" font-weight="800" fill="#1A1840" text-anchor="middle" dominant-baseline="central">5a</text>
<text x="800" y="178" font-size="20" text-anchor="middle" dominant-baseline="central">🤖</text>
<text x="746" y="214" font-size="16" class="t" text-anchor="start">Android</text>
<text x="746" y="233" font-size="11.5" class="m" text-anchor="start">ViewModel + Compose</text>
<g filter="url(#shadow)"><rect x="730" y="272" width="190" height="96" rx="16" fill="#26225C" stroke="#5AC8FA" stroke-width="2"/></g>
<rect x="746" y="286" width="32" height="22" rx="11" fill="#5AC8FA"/>
<text x="762" y="297" font-size="12" font-weight="800" fill="#1A1840" text-anchor="middle" dominant-baseline="central">5b</text>
<text x="800" y="298" font-size="20" text-anchor="middle" dominant-baseline="central">🍎</text>
<text x="746" y="334" font-size="16" class="t" text-anchor="start">iOS</text>
<text x="746" y="353" font-size="11.5" class="m" text-anchor="start">ObservableObject + SwiftUI</text>
</g>
